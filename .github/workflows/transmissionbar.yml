name: TransmissionBar beta build
on:
  push:
    branches: [main, transmissionbar-0.7]
    paths:
      - 'TransmissionBar/**'
      - '.github/workflows/transmissionbar.yml'
  pull_request:
    paths:
      - 'TransmissionBar/**'
      - '.github/workflows/transmissionbar.yml'
  workflow_dispatch:
    inputs:
      draft_release:
        description: Create a draft v0.7 prerelease after the build passes (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: transmissionbar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: TransmissionBar
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check build tools and architecture
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --find xctest
      - name: Check release packaging helpers
        run: python3 -m unittest discover -s Tests/Packaging -v
      - name: Install engine for bundling
        run: brew install transmission-cli
      - name: Test, build and package release files
        run: bash scripts/package-release.sh
      - name: Record packaged system requirements
        run: |
          cat dist/release/build-info.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload DMG, sources and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TransmissionBar-0.7-Apple-Silicon
          path: TransmissionBar/dist/release/*
          if-no-files-found: error
          retention-days: 30
  draft-release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: TransmissionBar-0.7-Apple-Silicon
          path: release-files
      - name: Create draft beta for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create transmissionbar-v0.7 release-files/*.dmg release-files/*-sources.tar.gz release-files/SHA256SUMS.txt release-files/build-info.json \
            --target "$RELEASE_COMMIT" --title 'TransmissionBar 0.7 public beta' \
            --notes-file release-files/RELEASE-NOTES.md --draft --prerelease
